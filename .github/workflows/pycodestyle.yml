name: Pycodestyle

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pycodestyle
        run: pip install pycodestyle

      - name: Check code style
        run: python -m pycodestyle .
